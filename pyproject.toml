[project]
name = "candvg"
version = "0.1.0"
description = "Experimental code for `Recognizing Dialogue Ambiguity via Candidate Set Visual Grounding`"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "setuptools",
  "dataclasses>=0.8",
  "dataclasses-json>=0.6.7",
  "einops>=0.8.2",
  "kaleido>=1.2.0",
  "matplotlib>=3.10.8",
  "plotly>=6.6.0",
  "pycocotools>=2.0.11",
  "rhoknp>=1.8.0",
  "tiktoken>=0.12.0",
  "timm>=1.0.25",
  "qwen-vl-utils>=0.0.14",
  "scipy>=1.15.3",
  "openai>=2.30.0",
]

[dependency-groups]
normal = [
  "torch",
  "torchvision",
  "transformers>=5.2",
  "huggingface_hub>=0.30.0",
  "sentencepiece>=0.2.1",
  "vllm>=0.7.3",
  "accelerate>=0.27.2",
]

dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.9",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/candvg"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 88         # default characters
indent-width = 4
target-version = "py310"  # The minimum Python version to target
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E",   # pycodestyle errors
          "W",   # pycodestyle warnings
          "F",   # flake8
          "I",   # isort
          # "RET", # flake8-return
          # "RUF", # ruff rules
        ]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = 3.10
